<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Bot Bev Co — Robot Fuel Operations Dashboard</title>
<style>
:root{color-scheme:light;
 --bg-deep:#F3EAD6;--bg-panel:#ffffff;--bg-surface:#E9DEC6;--border-lt:#D8C9A8;
 --text:#2D2015;--text-muted:#5C4A2E;--text-dim:#8A7856;--gold:#2E7FC4;--gold-br:#7A5E15;--cream:#16273c;
 --good:#3E7142;--good-s:#3E7142;--warn:#B07A1E;--warn-s:#9A6B12;--bad:#B33A1B;--bad-br:#A8331A;
 --jira:#1E6FE0;--jira-bg:rgba(38,132,255,0.12);--ss:#2E8B57;--ss-bg:rgba(46,139,87,0.12);}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg-deep);color:var(--text);font-family:'Helvetica Neue',Arial,sans-serif;font-size:13px}
a{color:var(--gold);text-decoration:none}a:hover{text-decoration:underline}
header.topbar{display:flex;align-items:center;gap:18px;padding:13px 20px;background:var(--bg-panel);border-bottom:2px solid var(--gold)}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.brand .logo{height:46px;width:auto;display:block;border-radius:6px;box-shadow:0 1px 4px rgba(16,35,59,.18)}
.brand .name{font-family:Georgia,serif;font-size:23px;letter-spacing:.13em;color:var(--cream)}
.brand .tag{font-size:9px;letter-spacing:.3em;color:var(--gold)}
.title-block{flex:1}.title-block .title{font-family:Georgia,serif;font-size:16px;color:var(--cream)}
.title-block .sub{font-size:11px;color:var(--text-muted);margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid}
.pill .dot{width:9px;height:9px;border-radius:50%}
.pill.good{border-color:var(--good-s);color:var(--good);background:rgba(62,113,66,.15)}.pill.good .dot{background:var(--good)}
.pill.warn{border-color:var(--warn-s);color:var(--warn);background:rgba(184,134,11,.15)}.pill.warn .dot{background:var(--warn)}
.pill.bad{border-color:var(--bad);color:var(--bad-br);background:rgba(179,58,27,.15)}.pill.bad .dot{background:var(--bad-br)}
nav.tabs{display:flex;padding:0 14px;background:var(--bg-panel);border-bottom:1px solid var(--border-lt);overflow-x:auto}
nav.tabs button{background:none;border:none;color:var(--text-muted);padding:11px 14px;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;font-family:inherit}
nav.tabs button.active{color:var(--gold-br);border-bottom-color:var(--gold);background:rgba(46,127,196,.08)}
main{padding:16px 20px 60px;max-width:1500px;margin:0 auto}
.pane{display:none}.pane.active{display:block}
.grid{display:grid;gap:13px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
.panel{background:var(--bg-panel);border:1px solid var(--border-lt);border-radius:5px;padding:13px 15px;position:relative}
.panel::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--gold);opacity:.5}
.panel.good::before{background:var(--good-s);opacity:1}.panel.warn::before{background:var(--warn-s);opacity:1}.panel.bad::before{background:var(--bad);opacity:1}
.panel h2{font-family:Georgia,serif;font-size:13px;letter-spacing:.15em;color:var(--gold);margin-bottom:3px;text-transform:uppercase;font-weight:normal}
.panel .sub{font-size:9.5px;letter-spacing:.13em;color:var(--text-dim);margin-bottom:11px;text-transform:uppercase}
.kpi{font-family:Georgia,serif;font-size:32px;color:var(--cream);line-height:1}.kpi.sm{font-size:24px}
.kpi-lbl{font-size:10px;letter-spacing:.11em;color:var(--text-dim);text-transform:uppercase;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-dim);padding:6px 7px;border-bottom:1px solid var(--border-lt)}
td{padding:6px 7px;border-bottom:1px solid rgba(115,133,160,.4)}
.tag-rag{display:inline-block;padding:2px 8px;border-radius:3px;font-size:10px;font-weight:700}
.rag-red{background:rgba(179,58,27,.22);color:var(--bad-br);border:1px solid var(--bad)}
.rag-amber{background:rgba(184,134,11,.2);color:var(--warn);border:1px solid var(--warn-s)}
.rag-green{background:rgba(62,113,66,.2);color:var(--good);border:1px solid var(--good-s)}
.chip{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600;margin-right:4px}
.chip.jira{background:var(--jira-bg);color:#1E6FE0;border:1px solid var(--jira)}
.chip.ss{background:var(--ss-bg);color:#226B43;border:1px solid var(--ss)}
.bar{height:11px;background:var(--bg-surface);border-radius:6px;overflow:hidden;margin-top:5px}.bar>i{display:inline-block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--text-muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}.sw{width:11px;height:11px;border-radius:2px;display:inline-block}
.lb-row{display:flex;align-items:center;gap:11px;padding:7px 5px;border-bottom:1px solid rgba(115,133,160,.4)}
.lb-rank{font-family:Georgia,serif;font-size:17px;color:var(--gold);width:24px;text-align:center}
.lb-name{flex:1;font-weight:600}.lb-bar{flex:2;max-width:320px}.lb-val{font-family:Georgia,serif;font-size:15px;color:var(--cream);width:36px;text-align:right}
.note{font-size:10.5px;color:var(--text-dim);line-height:1.6;margin-top:9px}
.mt{margin-top:13px}.big-rag{font-family:Georgia,serif;font-size:42px;letter-spacing:.07em;line-height:1}
.wkchip{background:var(--bg-surface);border:1px solid var(--border-lt);color:var(--text-muted);padding:5px 12px;border-radius:14px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;letter-spacing:.04em}
.wkchip:hover{border-color:var(--gold)}
.wkchip.wk-active{background:var(--gold);color:#fff;border-color:var(--gold-br)}
.rag-input{display:flex;justify-content:space-between;align-items:center;padding:9px 4px;border-bottom:1px solid rgba(115,133,160,.4);gap:10px}
.mini{font-size:10px;color:var(--text-dim);letter-spacing:.08em;text-transform:uppercase}
.exec{font-size:12.5px;line-height:1.8;color:var(--text-muted)}
.donut-wrap{display:flex;align-items:center;gap:14px}
#loading{padding:40px;text-align:center;color:var(--text-muted)}
.spin{display:inline-block;width:22px;height:22px;border:3px solid var(--bg-surface);border-top-color:var(--gold);border-radius:50%;animation:s 0.9s linear infinite;vertical-align:middle;margin-right:10px}
@keyframes s{to{transform:rotate(360deg)}}
body{font-size:13.5px}
.panel{box-shadow:0 1px 4px rgba(16,35,59,.10)}
th{color:#6B5B3A}
td{color:#16273c}
tr:nth-child(even) td{background:rgba(46,127,196,.06)}
.note{color:#6B5B3A}.kpi-lbl{color:#7385a0}.mini{color:#7385a0}
a{color:#8A6A1E}
nav.tabs{box-shadow:0 1px 3px rgba(16,35,59,.08)}
.src{position:absolute;top:11px;right:12px;font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:#1E6FE0;background:var(--jira-bg);border:1px solid var(--jira);border-radius:10px;padding:2px 8px;font-weight:700;z-index:2}
.src.ss{color:#226B43;background:var(--ss-bg);border-color:var(--ss)}
.src:hover{text-decoration:none;filter:brightness(.93)}
.srcbar{display:inline-flex;gap:7px;flex-wrap:wrap;align-items:center;margin-left:6px}
.srcbar a{font-size:9px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;padding:3px 9px;border-radius:11px}
.srcbar a.j{color:#1E6FE0;background:var(--jira-bg);border:1px solid var(--jira)}
.srcbar a.s{color:#226B43;background:var(--ss-bg);border:1px solid var(--ss)}
.src-inline{font-size:9px;font-weight:700;color:#226B43;border:1px solid var(--ss);background:var(--ss-bg);border-radius:9px;padding:1px 6px;letter-spacing:.04em;white-space:nowrap}
.src-inline.j{color:#1E6FE0;border-color:var(--jira);background:var(--jira-bg)}
.why{display:inline-block;margin-left:7px;font-size:8.5px;font-weight:700;color:#8A6A1E;background:rgba(46,127,196,.12);border:1px solid var(--gold);border-radius:9px;padding:1px 7px;cursor:pointer;letter-spacing:.06em;text-transform:uppercase;vertical-align:middle;white-space:nowrap}
.why:hover{filter:brightness(.94)}
.why::before{content:'ⓘ ';}
.modal{display:none;position:fixed;inset:0;background:rgba(16,35,59,.5);z-index:60;align-items:flex-start;justify-content:center;padding:60px 20px;overflow:auto}
.modal.show{display:flex}
.modal-card{background:var(--bg-panel);border:1px solid var(--gold);border-radius:8px;max-width:600px;width:100%;padding:22px 24px;box-shadow:0 10px 40px rgba(16,35,59,.4);position:relative}
.modal-x{position:absolute;top:10px;right:15px;font-size:24px;color:var(--text-muted);cursor:pointer;line-height:1}
.modal-body h3{font-family:Georgia,serif;color:var(--gold-br);font-size:17px;margin-bottom:4px}
.modal-body .msub{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);margin-bottom:12px}
.modal-body p{font-size:12.5px;color:var(--text-muted);line-height:1.65;margin:8px 0}
.modal-body .mrow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--border-lt);font-size:12px}
.modal-body .mrow b{color:var(--cream)}
.modal-body .mnote{font-size:11px;color:var(--text-dim);line-height:1.55;margin:2px 0 10px;padding-left:2px}
.bpill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;letter-spacing:.03em;line-height:1;vertical-align:middle}
.bpill .blbl{display:inline-flex;flex-direction:column;align-items:center;line-height:1;text-align:center}
.bpill .blight{font-size:7px;font-weight:700;letter-spacing:.1em;opacity:.92;margin-bottom:1px}
td .bpill{font-size:10px;padding:2px 8px}
.modal-body .formula{background:var(--bg-surface);border-left:3px solid var(--gold);padding:8px 11px;border-radius:0 4px 4px 0;font-size:12px;color:var(--cream);margin:10px 0;line-height:1.6}
.modebar{padding:6px 20px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;text-align:center;border-bottom:1px solid var(--border-lt)}
.modebar.live{background:rgba(62,113,66,.14);color:var(--good)}
.modebar.snap{background:rgba(46,127,196,.16);color:var(--gold-br)}
.bcard{text-align:center}
.bcard-h{font-family:Georgia,serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:2px}
.bcard-v{font-family:Georgia,serif;font-size:30px;color:var(--cream);line-height:1}
.bcard-verdict{font-size:12px;font-weight:700;letter-spacing:.04em;margin:3px 0 4px;text-transform:uppercase}
.bcard-sub{font-size:10px;color:var(--text-dim);letter-spacing:.03em;margin-top:3px}
.hm{display:inline-flex;flex-direction:column;gap:4px;margin-top:8px}
.hm-row{display:flex;gap:4px;align-items:center}
.hm-cell{width:50px;height:34px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px}
.hm-axis{width:20px;text-align:center;font-size:10px;color:var(--text-dim);font-weight:700}
.hm-xlab{width:50px;text-align:center;font-size:10px;color:var(--text-dim);font-weight:700}
.hm-axes{font-size:9.5px;color:var(--text-dim);letter-spacing:.06em;text-transform:uppercase;margin-top:7px}
.err{color:var(--bad-br);font-size:12px;padding:8px;background:rgba(179,58,27,.1);border:1px solid var(--bad);border-radius:4px;margin-top:8px}
.sowdoc{font-size:12.5px;line-height:1.55;color:var(--text);max-width:960px}
.sowdoc .sowh{font-family:Georgia,serif;font-size:13px;letter-spacing:.05em;color:var(--gold-br);margin:17px 0 6px;text-transform:none;font-weight:600;border-bottom:1px solid var(--border-lt);padding-bottom:3px}
.sowdoc .sowp{margin:7px 0}
.sowdoc .sowd{margin:8px 0;padding:4px 0 4px 11px;border-left:3px solid var(--gold)}
.sowdoc .sowi{margin:6px 0 6px 22px;color:var(--text-muted)}
.sowdoc .sowdid{color:var(--gold-br)}
a.dref{color:var(--gold-br);font-weight:700;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px;cursor:pointer}
a.dref:hover{background:rgba(46,127,196,.22);border-radius:3px}
.sowdoc .sowul{margin:5px 0 11px 20px;padding-left:6px}
.sowdoc .sowul li{margin:3px 0}
</style>

<style id="brand-theme">
:root{
 --bg-deep:#e4eaf1;--bg-panel:#ffffff;--bg-surface:#d6deea;--border-lt:#c2cede;
 --text:#16273c;--text-muted:#425468;--text-dim:#7385a0;--gold:#2E7FC4;--gold-br:#1c5a94;--cream:#16273c;
 --good:#2E9E6A;--good-s:#26855a;--warn:#C08A2E;--warn-s:#9A6B12;--bad:#C0432A;--bad-br:#A8331A;
 --jira:#2E7FC4;--jira-bg:rgba(46,127,196,0.12);--ss:#3E9EA8;--ss-bg:rgba(62,158,168,0.12);}
html,body{background:linear-gradient(180deg,#e9eef4,#dbe3ee)!important}
header.topbar{background:linear-gradient(135deg,#0e1e33 0%,#1f4a78 60%,#2a5f96 100%)!important;border-bottom:3px solid #9fb4c9;box-shadow:0 2px 10px rgba(16,35,59,.25)}
.brand .logo{height:54px;border-radius:8px;background:#fff;padding:2px;box-shadow:0 1px 6px rgba(0,0,0,.25)}
.title-block .title{color:#ffffff!important;letter-spacing:.02em}
.title-block .sub{color:#bcd0e6!important}
.demoback{display:inline-block;background:linear-gradient(135deg,#2E7FC4,#1c5a94);color:#fff!important;font-weight:700;padding:6px 13px;border-radius:16px;font-size:11px;letter-spacing:.03em;text-decoration:none;border:1px solid #7fb0dd}
.demoback:hover{filter:brightness(1.12);text-decoration:none}
.demotag{display:inline-block;margin-left:10px;font-size:10px;letter-spacing:.14em;color:#bcd0e6;text-transform:uppercase}
nav.tabs{background:#eef3f9;border-bottom:1px solid #c2cede}
nav.tabs button.active{color:#1c5a94!important;border-bottom-color:#2E7FC4!important;background:rgba(46,127,196,.10)!important}
.modebar.snap{background:#0e1e33;color:#bcd0e6;border-bottom:1px solid #2E7FC4}
.panel::before{background:linear-gradient(90deg,#2E7FC4,#9fb4c9)!important;opacity:1}
.kpi,.big-rag{color:#16273c}
.brand .tag{color:#9fc2e6}
</style>
</head>

/* ===== Jira paginated fetch ===== */
async function fetchJira(){
 let token=null, nodes=[];
 for(let i=0;i<6;i++){
   const args={cloudId:CLOUD, jql:"project = SPY ORDER BY key ASC",
     maxResults:100, fields:["status","assignee","issuetype","parent","duedate","summary"], responseContentFormat:"markdown"};
   if(token) args.nextPageToken=token;
   const res=await mcp(JIRA,args);
   const n=res.issues?.nodes||[]; nodes=nodes.concat(n);
   const pi=res.issues?.pageInfo||{}; if(!pi.hasNextPage||!pi.endCursor) break; token=pi.endCursor;
 }
 const idmap={}; nodes.forEach(x=>{ if(x&&x.key) idmap[x.key]=x; });
 const CRITD={D1:1,D3:1,D4:1,D9:1,D12:1};
 function dFromInit(node){ if(!node) return null; const f=node.fields||{}; let m=String(f.summary||'').match(/D(\d+)/); if(m) return 'D'+m[1]; m=String(node.key||'').match(/SPY-(\d+)/); if(m && (+m[1])<=16) return 'D'+m[1]; return null; }
 function deliv(node){ let cur=node, g=0; while(cur && g++<6){ const it=((cur.fields||{}).issuetype||{}).name; if(it==='Initiative') return dFromInit(cur); const p=(cur.fields||{}).parent; if(!p||!p.key) return null; const nx=idmap[p.key]||p; if(nx===cur) return null; cur=nx; } return null; }
 const NORMA={'neelan.singh':'Neelan Singh','anand.yadav':'Anand Yadav','sunita.pandey':'Sunita Pandey'};
 const cat={}, asgTot={}, asgDone={}, types={}, issues=[]; let total=0;
 nodes.forEach(x=>{const f=x.fields||{}; const it=(f.issuetype||{}).name||'?'; types[it]=(types[it]||0)+1; if(it==='Epic') return;
   total++; const c=((f.status||{}).statusCategory||{}).name||'?'; cat[c]=(cat[c]||0)+1;
   let a=(f.assignee||{}).displayName||'Unassigned'; a=NORMA[a]||a; asgTot[a]=(asgTot[a]||0)+1; if(c==='Done')asgDone[a]=(asgDone[a]||0)+1;
   const d=deliv(x); const dtop=d?('D'+((String(d).match(/\d+/)||[''])[0])):null;
   issues.push({key:x.key, title:f.summary||'', cat:c, assignee:a, deliverable:d, duedate:f.duedate||null, type:it, critical:!!(dtop&&CRITD[dtop])}); });
 return {total, done:cat['Done']||0, inprog:cat['In Progress']||0, todo:cat['To Do']||0, asgTot, asgDone, types, issues};
}

window.__SOW={p0:"<p class=\"sowp\">This Statement of Work (\"SOW\") #6 is made and entered into as of June ___, 2026 by and between Positronic Partners LLC, a Delaware corporation (\"Positronic Partners\"), with offices at 1901 Positronic Way, New Cybertron CA 90210 and Bot Bev Co, Inc., a New York corporation (\"Client\") with offices at 1 Robot Fuel Plaza, Syracuse, NY 13202. Positronic Partners and Client are each a \"party\" and together the \"parties.\" This SOW is subject to the Master Service Agreement (\"Agreement\") between the parties dated December 7, 2022.</p><p class=\"sowp\">The purpose of this SOW is for Client and Positronic Partners to mutually agree to the Scope, Effort Estimate, Timeline, Professional Fees and Agreed Conditions associated with Phase 0 (Discovery) of Project Robot Fuel, a 24-month, six-phase program with a total program value of $120,000,000 as summarized in the Program Roadmap below.</p><p class=\"sowp\">Phase 0 is the only committed and authorized phase under this SOW. Bot Bev Co may cancel this SOW for any reason and, unless services have already been provided, there is no financial obligation for any phase after Phase 0.</p><h3 class=\"sowh\">1. Phase 0 Commitment and Exit.</h3><p class=\"sowi\">a. Phase 0 Commitment Only. Phase 0 is the only committed and authorized phase under this SOW. No fee, deposit or charge accrues for any phase after Phase 0 unless and until Bot Bev Co issues a separate written notice to proceed for that phase.</p><p class=\"sowi\">b. Exit Without Penalty. Bot Bev Co may terminate this SOW at any time, before, during or after Phase 0, for any reason or no reason, without penalty, termination fee or wind-down charge of any kind. Upon exit Bot Bev Co is obligated only for the Phase 0 fee prorated to the work actually performed and accepted up to the exit date, and any unapplied deposit is refunded within 30 days.</p><h3 class=\"sowh\">2. Phase 0 Timeline. Months 1&ndash;2 (approximately 8 weeks).</h3><h3 class=\"sowh\">3. Phase 0 Scope and Deliverables</h3><p class=\"sowd\"><b class=\"sowdid\">D1.</b> Current-state assessment across data, business process and AI readiness. A written assessment establishing, from Bot Bev Co source systems, the current baseline and the staged targets for every outcome and KPI, and defining, for each KPI, the exact measurement method and data source.</p><p class=\"sowd\"><b class=\"sowdid\">D2.</b> Program business case validation and value model for the full six-phase roadmap, presented to Bot Bev Co Leadership for acceptance at Stage Gate 1.</p><p class=\"sowd\"><b class=\"sowdid\">D3.</b> Data landscape and source-system inventory. The foundation for the Phase 1 data dictionary and semantic layer, including data domains, ownership, quality and lineage findings.</p><p class=\"sowd\"><b class=\"sowdid\">D4.</b> Integration and architecture map. A diagram and inventory of every system with data flowing into or out of the enterprise platform, with named interface owners by role.</p><p class=\"sowd\"><b class=\"sowdid\">D5.</b> Six-phase roadmap, sequencing and blackout-safe plan respecting the November and December blackout, with phase dependency gates expressed.</p><p class=\"sowd\"><b class=\"sowdid\">D6.</b> Baseline delivery team plan by phase, showing each role, location and onshore or offshore split with hours per week or month. No individuals are named until the applicable phase is authorized.</p><p class=\"sowd\"><b class=\"sowdid\">D7.</b> Risk register. A manufacturing-specific risk register with likelihood, impact, mitigation and an owner (by role) per risk.</p><p class=\"sowd\"><b class=\"sowdid\">D8.</b> OCM and AI governance assessment, including change-readiness, stakeholder mapping and an approach for scaling AI governance, roles, cadences and decision rights.</p><p class=\"sowd\"><b class=\"sowdid\">D9.</b> Quick-wins backlog. A prioritized backlog of fast wins for immediate adoption value, scoped in Phase 0 and implemented only in a later authorized phase.</p><p class=\"sowd\"><b class=\"sowdid\">D10.</b> KPI baselines, targets and measurement methodology, staged per phase, plus the incentive program design and governance for subsequent phases (created in Phase 0, not implemented in Phase 0). Achievement is measured from Bot Bev Co data with no vendor self-certification.</p><p class=\"sowd\"><b class=\"sowdid\">D11.</b> Tooling and governance setup. Configuration of the agreed project tools (Bot Bev Co owned and administered), the EVM dashboard and the program compendium.</p><p class=\"sowd\"><b class=\"sowdid\">D12.</b> Agentic architecture and governance blueprint. The foundation for Phase 3, covering agent orchestration, management, guardrails and how they integrate with the Bot Bev Co environment.</p><p class=\"sowd\"><b class=\"sowdid\">D13.</b> Security and privilege assessment for AI agents, including least-privilege, segregation-of-duties and human-in-the-loop controls.</p><p class=\"sowd\"><b class=\"sowdid\">D14.</b> Stage Gate 1 acceptance package. A consolidated package presenting deliverables D1 to D13 for a single Bot Bev Co Leadership go or no-go decision before any future phase authorization or fee.</p><p class=\"sowp\">Acceptance. Each Phase 0 deliverable is complete only upon written acceptance by an authorized Bot Bev Co representative, who has three business days from delivery to accept or reject (with written reasons). No deliverable is deemed accepted by passage of time, by use or by silence.</p><h3 class=\"sowh\">4. Program Roadmap and Phase Values</h3><ul class=\"sowul\"><li>Phase 0 &mdash; Discovery &mdash; Months 1&ndash;2 &mdash; $10,000,000 (committed)</li><li>Phase 1 &mdash; Data Setups, Data Dictionary &amp; Semantic Layer &mdash; Months 3&ndash;6 &mdash; $18,000,000</li><li>Phase 2 &mdash; Business Process Analysis &amp; Optimization &mdash; Months 7&ndash;10 &mdash; $18,000,000</li><li>Phase 3 &mdash; Agentic Architecture &amp; Governance &mdash; Months 11&ndash;14 &mdash; $22,000,000</li><li>Phase 4 &mdash; Assisted Agents &mdash; Months 15&ndash;19 &mdash; $24,000,000</li><li>Phase 5 &mdash; Autonomous Virtual Agents &amp; Robot Implementation &mdash; Months 20&ndash;24 &mdash; $28,000,000</li><li><b>Total Program &mdash; 24 Months &mdash; $120,000,000</b></li></ul><h3 class=\"sowh\">5. Phase 0 Fees.</h3><p class=\"sowi\">a. Maximum Fee. The maximum fee for all Phase 0 deliverables set forth above shall be $10,000,000. No hypercare is included in Phase 0.</p><p class=\"sowi\">b. Phase 0 Deposit. Based on the maximum Phase 0 fee of $10,000,000, the Phase 0 deposit is 20% ($2,000,000), credited against Phase 0 invoices; any unapplied balance is refunded upon termination or completion.</p><p class=\"sowi\">c. Billing Transparency and Cadence. All billing under this SOW shall be semi-monthly. Each invoice must itemize by workstream and the staff time recorded.</p><p class=\"sowp\">IN WITNESS WHEREOF, the parties have caused this SOW to be executed by their duly authorized representatives as identified below.</p><p class=\"sowp\">Bot Bev Co, Inc.</p><p class=\"sowp\">By: ______________________&nbsp;&nbsp;&nbsp;Name: ______________________&nbsp;&nbsp;&nbsp;Title: ______________________&nbsp;&nbsp;&nbsp;Date: ______________</p><p class=\"sowp\">Positronic Partners LLC</p><p class=\"sowp\">By: ______________________&nbsp;&nbsp;&nbsp;Name: ______________________&nbsp;&nbsp;&nbsp;Title: ______________________&nbsp;&nbsp;&nbsp;Date: ______________</p>",p1:"<p class=\"sowp\">This Statement of Work (\"SOW\") #6 (Proposed) is made and entered into as of ________ __, 20__ by and between Positronic Partners LLC, a Delaware corporation (\"Positronic Partners\"), with offices at 1901 Positronic Way, New Cybertron CA 90210 and Bot Bev Co, Inc., a New York corporation (\"Client\"), with offices at 1 Robot Fuel Plaza, Syracuse, NY 13202. This SOW is subject to the Master Service Agreement dated December 7, 2022. Where this SOW conflicts with the Agreement, this SOW controls.</p><p class=\"sowp\">The purpose of this SOW is for Client and Positronic Partners to mutually agree to the Scope, Timeline, Professional Fees and Agreed Conditions for Phases 1 through 5 of Project Robot Fuel. Each phase below requires a separate written Bot Bev Co notice to proceed and is subject to acceptance at its Stage Gate. Combined value of Phases 1 through 5 is $110,000,000; with Phase 0 the total program value is $120,000,000 over 24 months.</p><h3 class=\"sowh\">Phase 1: Data Setups, Data Dictionary &amp; Semantic Layer &mdash; 4 Month Timeline (Months 3&ndash;6) &mdash; $18,000,000</h3><ul class=\"sowul\"><li>Establish the enterprise data foundation across priority source systems.</li><li>Build the canonical data dictionary and business glossary with governed definitions.</li><li>Stand up the semantic (metrics) layer so every KPI has a single governed definition.</li><li>Data quality, lineage and master-data remediation for priority domains.</li></ul><p class=\"sowp\"><b>Deliverables:</b> Data dictionary and business glossary, semantic layer with governed metric definitions, data-quality baseline, master-data remediation for priority domains.</p><h3 class=\"sowh\">Phase 2: Business Process Analysis &amp; Optimization &mdash; 4 Month Timeline (Months 7&ndash;10) &mdash; $18,000,000</h3><ul class=\"sowul\"><li>Map and analyze core business processes end to end.</li><li>Identify standardization, optimization and automation opportunities.</li><li>Design target-state processes, controls and KPI improvement plans.</li></ul><p class=\"sowp\"><b>Deliverables:</b> Current-state process maps, prioritized optimization backlog, target-state process and control designs, KPI improvement plan.</p><h3 class=\"sowh\">Phase 3: Agentic Architecture &amp; Governance &mdash; 4 Month Timeline (Months 11&ndash;14) &mdash; $22,000,000</h3><ul class=\"sowul\"><li>Design and stand up the agentic platform: orchestration, tooling and guardrails.</li><li>Establish the AI Governance Office with policies, roles and decision rights.</li><li>Implement least-privilege, segregation-of-duties and human-in-the-loop controls for agents.</li></ul><p class=\"sowp\"><b>Deliverables:</b> Agentic reference architecture, governance operating model and RACI, agent control and security framework.</p><h3 class=\"sowh\">Phase 4: Assisted Agents &mdash; 5 Month Timeline (Months 15&ndash;19) &mdash; $24,000,000</h3><ul class=\"sowul\"><li>Deploy human-in-the-loop assisted agents for priority workflows.</li><li>Embed copilot / assist patterns into optimized business processes.</li><li>Drive adoption through training, change management and measurement.</li></ul><p class=\"sowp\"><b>Deliverables:</b> Assisted-agent releases in production, adoption metrics, operator playbooks and training content.</p><h3 class=\"sowh\">Phase 5: Autonomous Virtual Agents &amp; Robot Implementation &mdash; 5 Month Timeline (Months 20&ndash;24) &mdash; $28,000,000</h3><ul class=\"sowul\"><li>Graduate qualified workflows to supervised autonomous virtual agents.</li><li>Implement physical robots and plant-floor automation.</li><li>Full governance, monitoring, hypercare and handoff to Bot Bev Co.</li></ul><p class=\"sowp\"><b>Deliverables:</b> Autonomous virtual agents in supervised production, robot deployment on the plant floor, monitoring and run-book, and program handoff.</p><p class=\"sowp\">Hypercare. Hypercare is included at 3 months per phase.</p><p class=\"sowp\">SOW Specific Agreements</p><ul class=\"sowul\"><li>Bot Bev Co has a blackout calendar of November and December where availability is minimal; the project plan reflects this.</li><li>The assigned Program Manager is confirmed for the life of the program, provided continuous employment with Positronic Partners and no significant promotion. Bot Bev Co may refuse or require replacement of any individual at any time, no reason required.</li><li>Project management tools are Bot Bev Co owned and administered. EVM data is provided by Positronic Partners and reports are produced by the Client.</li><li>Knowledge transfer to Bot Bev Co IT is a condition of the work.</li><li>Incentive Program: a 20% bonus and 10% reduction structure applies to KPIs important to Bot Bev Co (OTIF, Inventory Accuracy, Forecast MAPE, Close Cycle Time, Planner Touch Time, Exception SLA). Measurement is defined in Phase 0 and takes effect only for authorized phases. Achievement is measured by Bot Bev Co from its own data with no vendor self-certification, on a sustained 30-day basis, with partial payment for partial achievement.</li><li>Out of Scope: anything not listed as in scope is out of scope.</li></ul><p class=\"sowp\">Professional Fees. The Services are provided on a fixed-fee basis per the schedule below. Any work outside scope requires a separate SOW or Project Change Notice (PCN).</p><ul class=\"sowul\"><li>Phase 1 (Months 3&ndash;6): $18,000,000</li><li>Phase 2 (Months 7&ndash;10): $18,000,000</li><li>Phase 3 (Months 11&ndash;14): $22,000,000</li><li>Phase 4 (Months 15&ndash;19): $24,000,000</li><li>Phase 5 (Months 20&ndash;24): $28,000,000</li><li><b>Subtotal, Phases 1&ndash;5: $110,000,000</b></li><li><b>Total Program incl. Phase 0: $120,000,000</b></li></ul><p class=\"sowp\">IN WITNESS WHEREOF, the parties have caused this SOW to be executed by their duly authorized representatives as identified below.</p><p class=\"sowp\">Bot Bev Co, Inc.</p><p class=\"sowp\">By: ______________________&nbsp;&nbsp;&nbsp;Name: ______________________&nbsp;&nbsp;&nbsp;Title: ______________________&nbsp;&nbsp;&nbsp;Date: ______________</p><p class=\"sowp\">Positronic Partners LLC</p><p class=\"sowp\">By: ______________________&nbsp;&nbsp;&nbsp;Name: ______________________&nbsp;&nbsp;&nbsp;Title: ______________________&nbsp;&nbsp;&nbsp;Date: ______________</p>"};
